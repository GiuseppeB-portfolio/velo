<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}velo{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="mark" href="{{ url_for('index') }}">velo</a>
    <p class="local">Tutto resta su questo computer.</p>
    <nav>
      <a href="{{ url_for('index') }}">Pseudonimizza</a>
      <a href="{{ url_for('restore_page') }}">Ripristina</a>
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>
    <p>velo {{ version }}. Ascolta solo su questo computer. Il risultato è una pseudonimizzazione, non un'anonimizzazione.</p>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
