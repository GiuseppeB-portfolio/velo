name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} su ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Installa il pacchetto e gli strumenti di sviluppo
        run: python -m pip install -e ".[dev]"
      - name: Stile del codice
        run: |
          ruff check .
          ruff format --check .
      - name: Nessun dato, chiave o segreto nei file tracciati
        run: python scripts/check_publishable.py
      - name: Test con copertura
        run: pytest --cov --cov-report=term-missing
